name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Overwrite production environment
        env:
          API_URL_PROD: ${{ secrets.API_URL_PROD }}
        run: |
          test -n "$API_URL_PROD"

          mkdir -p src/environments

          cat > src/environments/environment.prod.ts << EOF
          export const environment = {
            production: true,
            apiUrl: '${API_URL_PROD}/api',
            fastApiUrl: '${FASTAPI_URL_PROD}/api',
          };
          EOF

      - name: Build production app
        run: npm run build -- --configuration production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SI2_SGD_HC_FIREBASE }}
          projectId: si2-sgd-hc-firebase
          channelId: live