<div class="space-y-6 max-w-2xl mx-auto">

  <!-- Header -->
  <div class="flex items-center gap-3">
    <button (click)="back()"
      class="p-2 rounded-lg hover:bg-hc-hover text-hc-text-2 transition-colors">
      <fa-icon [icon]="faArrowLeft" />
    </button>
    <fa-icon [icon]="faEdit" class="text-hc-primary text-xl" />
    <h2 class="text-xl font-semibold text-hc-text">Editar documento</h2>
  </div>

  <!-- Loading -->
  @if (loading()) {
    <div class="flex justify-center py-16">
      <fa-icon [icon]="faSpinner" class="animate-spin text-2xl text-hc-primary" />
    </div>
  }

  @if (!loading() && doc(); as d) {

    <!-- Info del documento (solo lectura) -->
    <div class="bg-hc-card rounded-xl border border-hc-border shadow-sm px-6 py-4 space-y-1">
      <p class="text-xs text-hc-text-3 uppercase tracking-wide font-medium">Documento</p>
      <p class="text-hc-text font-semibold">{{ docTitle() }}</p>
      <p class="text-hc-text-2 text-sm">Paciente: <span class="font-medium">{{ d.patientName }}</span></p>
    </div>

    <!-- Formulario de metadatos -->
    <form [formGroup]="form" (ngSubmit)="save()"
          class="bg-hc-card rounded-xl border border-hc-border shadow-sm overflow-hidden">

      <div class="px-6 py-4 border-b border-hc-border bg-hc-muted/40">
        <p class="text-sm font-semibold text-hc-text">Metadatos</p>
      </div>

      <div class="px-6 py-5 space-y-4">

        <!-- Fecha de emisión -->
        <div>
          <label class="block text-sm font-medium text-hc-text-2 mb-1.5">
            Fecha de emisión <span class="text-hc-error">*</span>
          </label>
          <input type="date" formControlName="issueDate"
            class="w-full px-3 py-2 rounded-lg border border-hc-border bg-hc-input
                   text-hc-text text-sm focus:outline-none focus:ring-2 focus:ring-hc-primary/30
                   focus:border-hc-primary transition-colors" />
        </div>

        <!-- Fecha de vencimiento -->
        <div>
          <label class="block text-sm font-medium text-hc-text-2 mb-1.5">
            Fecha de vencimiento
          </label>
          <input type="date" formControlName="expiryDate"
            class="w-full px-3 py-2 rounded-lg border border-hc-border bg-hc-input
                   text-hc-text text-sm focus:outline-none focus:ring-2 focus:ring-hc-primary/30
                   focus:border-hc-primary transition-colors" />
        </div>

        <!-- Estado -->
        <div>
          <label class="block text-sm font-medium text-hc-text-2 mb-1.5">Estado</label>
          <select formControlName="status"
            class="w-full px-3 py-2 rounded-lg border border-hc-border bg-hc-input
                   text-hc-text text-sm focus:outline-none focus:ring-2 focus:ring-hc-primary/30
                   focus:border-hc-primary transition-colors">
            @for (s of statuses; track s.value) {
              <option [value]="s.value">{{ s.label }}</option>
            }
          </select>
        </div>

      </div>

      <!-- Acciones del formulario -->
      <div class="px-6 py-4 border-t border-hc-border bg-hc-muted/40 flex items-center gap-3">
        <button type="submit" [disabled]="saving()"
          class="flex items-center gap-2 px-4 py-2 bg-hc-primary hover:bg-hc-primary-dark
                 text-white text-sm font-medium rounded-lg transition-colors
                 disabled:opacity-50 disabled:cursor-not-allowed">
          @if (saving()) {
            <fa-icon [icon]="faSpinner" class="animate-spin" />
            Guardando...
          } @else {
            Guardar cambios
          }
        </button>

        @if (saved()) {
          <div class="flex items-center gap-1.5 text-green-600 text-sm">
            <fa-icon [icon]="faCircleCheck" />
            Guardado correctamente
          </div>
        }

        @if (error()) {
          <p class="text-hc-error text-sm">{{ error() }}</p>
        }
      </div>

    </form>
  }

</div>
