<div class="min-h-screen bg-hc-app flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-3xl">
    <div class="bg-hc-surface rounded-3xl shadow-2xl border border-hc-border p-6 md:p-10 animate-in fade-in slide-in-from-bottom-4 duration-700">
      <app-progress-stepper [currentStep]="4" />

      <div class="text-center py-4">
        <div class="flex justify-center mb-6">
          <div class="relative">
            <div class="w-24 h-24 rounded-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center shadow-xl shadow-green-500/30 animate-in zoom-in duration-500">
              <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
              </svg>
            </div>
            <div class="absolute -inset-2 rounded-full bg-green-400/20 animate-ping opacity-0" style="animation-duration: 1s"></div>
          </div>
        </div>

        <h1 class="hc-h1 text-hc-text">{{ 'TENANTS.REGISTRATION_COMPLETE' | translate }}</h1>
        <p class="text-hc-text-3 text-sm mb-8">{{ 'TENANTS.REGISTRATION_COMPLETE_DESC' | translate }}</p>

        <div class="bg-gradient-to-r from-hc-primary/10 to-hc-primary/5 rounded-2xl border border-hc-primary/20 p-6 mb-8 text-left">
          <div class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-hc-primary to-hc-primary-dark flex items-center justify-center shadow-lg">
              <i class="fas fa-user text-white text-lg"></i>
            </div>
            <div>
              <p class="text-xs text-hc-text-3 uppercase tracking-wider font-medium">{{ 'TENANTS.YOUR_USERNAME' | translate }}</p>
              <p class="hc-h3 font-bold text-hc-text">{{ adminUsername }}</p>
            </div>
          </div>
          <div class="pt-4 border-t border-hc-border-i">
            <p class="text-xs text-hc-text-3 mb-1">{{ 'TENANTS.REMEMBER_PASSWORD' | translate }}</p>
            <p class="text-sm text-hc-text font-medium">{{ 'TENANTS.LOGIN_WITH_CREDENTIALS' | translate }}</p>
          </div>
        </div>

        <button
          (click)="goToLogin()"
          class="w-full py-4 px-6 bg-gradient-to-r from-hc-primary to-hc-primary-dark text-white font-bold rounded-xl
                 hover:from-hc-primary-dark hover:to-hc-primary-dark active:scale-[0.98] transition-all
                 shadow-lg shadow-hc-primary/30
                 flex items-center justify-center gap-3 text-base"
        >
          {{ 'TENANTS.FINISH' | translate }}
          <i class="fas fa-check text-sm"></i>
        </button>
      </div>
    </div>
  </div>
</div>
