@if (dangerPlaceholder()) {
  <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" (click)="onCancel()">
    <div class="bg-hc-surface rounded-2xl shadow-2xl max-w-md w-full p-6" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-hc-text">{{ title() }}</h3>
        <button (click)="onCancel()" class="p-1.5 rounded-lg text-hc-text-3 hover:text-hc-text hover:bg-hc-muted transition-colors">
          <fa-icon [icon]="faXmark" />
        </button>
      </div>
      <p class="text-sm text-hc-text-2 mb-4">
        {{ message() }}
      </p>
      <div class="space-y-1 mb-6">
        <label class="hc-label">{{ 'TENANTS.TYPE_NAME_TO_CONFIRM' | translate }}</label>
        <input type="text"
               [placeholder]="dangerPlaceholder()"
               [value]="userInput()"
               (input)="onInputChange($any($event.target).value)"
               class="hc-input" />
      </div>
      @if (userInput() && userInput() !== dangerMatchValue()) {
        <p class="text-xs text-hc-error mb-4">{{ 'TENANTS.CONFIRM_MISMATCH' | translate }}</p>
      }
      <div class="flex justify-end gap-3">
        <button (click)="onCancel()" class="hc-btn-secondary">
          {{ cancelText() | translate }}
        </button>
        <button (click)="onConfirm()"
                [disabled]="!isDangerConfirmed"
                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-red-800 hover:bg-red-900 transition-colors rounded-lg disabled:opacity-50 disabled:cursor-not-allowed">
          <fa-icon [icon]="faBan" />
          {{ confirmText() | translate }}
        </button>
      </div>
    </div>
  </div>
} @else {
  <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" (click)="onCancel()">
    <div class="bg-hc-surface rounded-2xl shadow-2xl max-w-md w-full p-6" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-hc-text">{{ title() }}</h3>
        <button (click)="onCancel()" class="p-1.5 rounded-lg text-hc-text-3 hover:text-hc-text hover:bg-hc-muted transition-colors">
          <fa-icon [icon]="faXmark" />
        </button>
      </div>
      <p class="text-sm text-hc-text-2 mb-6">{{ message() }}</p>
      <div class="flex justify-end gap-3">
        <button (click)="onCancel()" class="hc-btn-secondary">
          {{ cancelText() | translate }}
        </button>
        <button (click)="onConfirm()" [class]="getConfirmButtonClass()">
          <fa-icon [icon]="getIcon()" />
          {{ confirmText() | translate }}
        </button>
      </div>
    </div>
  </div>
}
