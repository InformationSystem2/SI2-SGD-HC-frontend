<aside
  class="transition-all duration-300 bg-slate-800 border-r border-slate-700 shadow-sm flex flex-col h-screen sticky top-0 shrink-0"
  [class]="sidebarService.expanded() ? 'w-64' : 'w-16'"
>
  <nav class="h-full flex flex-col flex-1">

    <!-- Botón toggle -->
    <div class="p-4 pb-2 flex items-center">
      <button
        (click)="sidebarService.toggle()"
        class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-orange-500"
      >
        <fa-icon [icon]="faBars"></fa-icon>
      </button>
    </div>

    <!-- Ítems de navegación -->
    <div class="flex-1 px-3 overflow-y-auto">
      <app-sidebar-group [items]="navItems" />
    </div>

    <!-- Footer: datos del usuario -->
    <div class="border-t border-slate-600 flex p-3 items-center">
      <img
        src="https://ui-avatars.com/api/?background=ff6b35&color=fff"
        class="w-10 h-10 rounded-md shrink-0"
        alt="avatar"
      />
      <div
        class="flex justify-between items-center overflow-hidden transition-all"
        [class]="sidebarService.expanded() ? 'w-52 ml-3' : 'w-0'"
      >
        <div class="leading-4">
          <h4 class="font-semibold text-white">Usuario</h4>
          <span class="text-xs text-slate-400">usuario&#64;gmail.com</span>
        </div>
        <fa-icon [icon]="faEllipsisVertical" class="text-slate-400"></fa-icon>
      </div>
    </div>

  </nav>
</aside>
