<aside
  class="flex flex-col h-screen bg-hc-sidebar border-r border-[var(--hc-border-sidebar)] shadow-sm shrink-0 fixed inset-y-0 left-0 z-40 transition-all duration-300 md:sticky md:top-0 md:translate-x-0"
  [class.-translate-x-full]="!sidebarService.mobileOpen()"
  [class.w-64]="sidebarService.expanded() || sidebarService.mobileOpen()"
  [class.w-16]="!sidebarService.expanded() && !sidebarService.mobileOpen()"
>
  <nav class="h-full flex flex-col flex-1 overflow-hidden">

    <!-- Brand + toggle -->
    <div class="p-3 flex items-center justify-between shrink-0">
      @if (sidebarService.expanded() || sidebarService.mobileOpen()) {
      <div class="flex items-center gap-2 overflow-hidden pl-1">
        <img
          src="iconSGDpng.png"
          alt="{{ 'APP_NAME' | translate }}"
          class="w-8 h-8 rounded-lg object-cover shrink-0"
        />
        <div class="overflow-hidden whitespace-nowrap">
          <p class="text-hc-primary font-bold hc-h4 leading-tight tracking-wide">
            {{ "DOCUSALUD" }}
          </p>
          <p class="text-hc-text-3 text-xs leading-tight">{{ 'NAV.APP_TAGLINE' | translate }}</p>
        </div>
      </div>
      }
      <button
        (click)="sidebarService.toggle()"
        class="p-1.5 rounded-lg bg-hc-muted hover:bg-hc-hover text-hc-primary transition-colors shrink-0"
        [class.mx-auto]="!sidebarService.expanded() && !sidebarService.mobileOpen()"
      >
        <fa-icon [icon]="faBars"></fa-icon>
      </button>
    </div>

    <!-- Divider -->
    <div class="mx-3 mb-1 border-t border-hc-border"></div>

    <!-- Nav items -->
    <div class="flex-1 px-2 py-1 overflow-y-auto">
      <app-sidebar-group [items]="visibleNavItems()" />
    </div>

    <!-- Footer: user info -->
    <div class="border-t border-hc-border p-3 flex items-center gap-0 shrink-0">
      <div class="w-9 h-9 rounded-lg bg-hc-primary/15 flex items-center justify-center shrink-0 ring-1 ring-hc-primary/25">
        <span class="text-hc-primary text-sm font-bold leading-none">
          {{ (authService.username() ?? '?')[0].toUpperCase() }}
        </span>
      </div>
      <div
        class="flex justify-between items-center overflow-hidden transition-all"
        [class.w-44]="sidebarService.expanded() || sidebarService.mobileOpen()"
        [class.w-0]="!sidebarService.expanded() && !sidebarService.mobileOpen()"
        [class.ml-2.5]="sidebarService.expanded() || sidebarService.mobileOpen()"
      >
        <div class="leading-4 min-w-0">
          <h4 class="font-semibold text-hc-text hc-h4 truncate">
            {{ authService.username() ?? '—' }}
          </h4>
          @if (firstRole()) {
            <span class="text-xs text-hc-text-3 truncate block">{{ firstRole() }}</span>
          }
        </div>
        <fa-icon [icon]="faEllipsisVertical" class="text-hc-text-3 shrink-0 text-xs"></fa-icon>
      </div>
    </div>

  </nav>
</aside>
