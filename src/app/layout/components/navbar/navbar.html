<header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6">

  <!-- Nombre de la empresa -->
  <span class="text-orange-500 font-bold text-lg tracking-wide">SI2 · SGD-HC</span>

  <!-- Usuario + Logout -->
  <div class="flex items-center gap-4">
    <span class="text-slate-300 text-sm">
      <!-- {{ authService.username() ?? 'Usuario' }} -->
        username
    </span>
    <button
      (click)="authService.logout()"
      class="flex items-center gap-2 px-3 py-1.5 rounded-md
             bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white
             text-sm transition-colors"
    >
      <fa-icon [icon]="faLogout" />
      <span>Salir</span>
    </button>
  </div>

</header>
