<header class="h-14 bg-hc-navbar border-b border-[var(--hc-border-sidebar)] shadow-sm flex items-center justify-between px-4 md:px-6 shrink-0">

  <!-- Left: hamburger (mobile) + brand -->
  <div class="flex items-center gap-3">
    <button
      (click)="sidebarService.openMobile()"
      class="md:hidden p-2 rounded-md text-hc-text-3 hover:text-hc-text hover:bg-hc-hover transition-colors"
      [title]="'NAVBAR.MENU' | translate"
    >
      <fa-icon [icon]="faBars" />
    </button>

    <div class="flex items-center gap-2">
      <img src="iconSGDpng.png" alt="DOCUSALUD" class="w-7 h-7 rounded-md object-cover shrink-0" />
      <span class="hidden sm:block text-hc-primary font-bold text-sm tracking-wide">DOCUSALUD</span>
    </div>

    <!-- Divider + tenant/clinic indicator -->
    <div class="hidden md:flex items-center gap-2 pl-2 border-l border-hc-border">
      <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md
                   bg-hc-primary/8 text-hc-primary text-xs font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-hc-success inline-block"></span>
        {{ 'NAVBAR.SYSTEM_ONLINE' | translate }}
      </span>
    </div>
  </div>

  <!-- Right: controls -->
  <div class="flex items-center gap-1.5 md:gap-2">

    <!-- Theme toggle -->
    <button
      (click)="themeService.toggle()"
      [title]="'NAVBAR.TOGGLE_THEME' | translate"
      class="p-2 rounded-md text-hc-text-3 hover:text-hc-text hover:bg-hc-hover transition-colors"
    >
      @if (themeService.theme() === 'dark') {
        <fa-icon [icon]="faSun" />
      } @else {
        <fa-icon [icon]="faMoon" />
      }
    </button>

    <!-- Language toggle -->
    <button
      (click)="langService.toggle()"
      class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold
             text-hc-text-2 hover:text-hc-text hover:bg-hc-hover border border-hc-border
             transition-colors"
    >
      <fa-icon [icon]="faLanguage" class="text-sm" />
      {{ 'NAVBAR.TOGGLE_LANG' | translate }}
    </button>

    <!-- Divider -->
    <div class="hidden md:block w-px h-5 bg-hc-border mx-0.5"></div>

    <!-- User pill -->
    <div class="hidden md:flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-hc-muted border border-hc-border">
      <div class="w-5 h-5 rounded-full bg-hc-primary/20 flex items-center justify-center">
        <span class="text-hc-primary text-xs font-bold leading-none">
          {{ (authService.username() ?? '?')[0].toUpperCase() }}
        </span>
      </div>
      <span class="text-hc-text-2 text-sm truncate max-w-28 font-medium">
        {{ authService.username() }}
      </span>
    </div>

    <!-- Logout -->
    <button
      (click)="authService.logout()"
      class="flex items-center gap-2 px-2.5 py-1.5 rounded-md
             bg-hc-muted hover:bg-hc-error hover:text-white
             text-hc-text-2 text-sm transition-colors border border-hc-border hover:border-hc-error"
    >
      <fa-icon [icon]="faLogout" />
      <span class="hidden sm:inline">{{ 'NAVBAR.LOGOUT' | translate }}</span>
    </button>

  </div>
</header>
