<header class="h-14 bg-hc-navbar border-b border-hc-border shadow-sm flex items-center justify-between px-4 md:px-6">

  <!-- Left: hamburger (mobile) + brand -->
  <div class="flex items-center gap-3">
    <button
      (click)="sidebarService.openMobile()"
      class="md:hidden p-2 rounded-md text-hc-text-3 hover:text-hc-text hover:bg-hc-hover transition-colors"
      [title]="'NAVBAR.MENU' | translate"
    >
      <fa-icon [icon]="faBars" />
    </button>

    <span class="text-hc-primary font-bold text-base tracking-wide flex items-center gap-2">
      <span class="w-7 h-7 rounded-md bg-hc-primary flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a1 1 0 011 1v3h3a1 1 0 010 2h-3v3a1 1 0 01-2 0v-3H8a1 1 0 010-2h3V7a1 1 0 011-1z"/>
        </svg>
      </span>
      <span class="hidden sm:inline">{{ 'APP_NAME' | translate }}</span>
    </span>
  </div>

  <!-- Right: controls -->
  <div class="flex items-center gap-1.5 md:gap-2">

    <!-- Theme toggle -->
    <button
      (click)="themeService.toggle()"
      [title]="'NAVBAR.TOGGLE_THEME' | translate"
      class="p-2 rounded-md text-hc-text-3 hover:text-hc-text hover:bg-hc-hover transition-colors"
    >
      @if (themeService.theme() === 'dark') {
        <fa-icon [icon]="faSun" />
      } @else {
        <fa-icon [icon]="faMoon" />
      }
    </button>

    <!-- Language toggle -->
    <button
      (click)="langService.toggle()"
      class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-semibold
             text-hc-text-2 hover:text-hc-text hover:bg-hc-hover border border-hc-border
             transition-colors"
    >
      <fa-icon [icon]="faLanguage" class="text-sm" />
      {{ 'NAVBAR.TOGGLE_LANG' | translate }}
    </button>

    <!-- Username -->
    <span class="text-hc-text-2 text-sm hidden md:block truncate max-w-32">
      {{ authService.username() }}
    </span>

    <!-- Logout -->
    <button
      (click)="authService.logout()"
      class="flex items-center gap-2 px-2.5 py-1.5 rounded-md
             bg-hc-muted hover:bg-hc-error hover:text-white
             text-hc-text-2 text-sm transition-colors"
    >
      <fa-icon [icon]="faLogout" />
      <span class="hidden sm:inline">{{ 'NAVBAR.LOGOUT' | translate }}</span>
    </button>

  </div>
</header>
