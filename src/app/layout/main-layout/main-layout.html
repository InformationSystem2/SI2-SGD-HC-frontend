<div class="flex min-h-screen bg-hc-app">

  <!-- Mobile backdrop -->
  @if (sidebarService.mobileOpen()) {
    <div
      class="fixed inset-0 z-30 bg-black/50 md:hidden"
      (click)="sidebarService.closeMobile()"
    ></div>
  }

  <app-sidebar />

  <div class="flex flex-col flex-1 overflow-hidden min-w-0">
    <app-navbar />
    <main class="flex-1 p-4 md:p-6 text-hc-text overflow-auto">
      <router-outlet />
    </main>
  </div>

  <!-- Floating help assistant -->
  <app-help-chat-button></app-help-chat-button>

</div>
